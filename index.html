<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a1628"/>
<title>RadarHujan — Cuaca Hyperlocal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a1628;--sf:#111e35;--sf2:#162440;--bd:rgba(255,255,255,0.08);--tx:#e8f0fe;--mt:#7a94c1;--ac:#3b82f6;--rn:#60a5fa;--st:#f87171;--dr:#fbbf24;--cl:#34d399;--mono:'Space Mono',monospace;--sans:'Sora',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
nav{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000;background:rgba(10,22,40,.95);backdrop-filter:blur(12px)}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cl);animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.nav-r{display:flex;gap:6px}
.btn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--mt);cursor:pointer;font-family:var(--sans);transition:all .2s}
.btn:hover{border-color:var(--ac);color:var(--tx)}
.btn-p{background:var(--ac);border-color:var(--ac);color:#fff}
.hero{padding:1rem 1.25rem;border-bottom:1px solid var(--bd)}
.hero-title{font-size:18px;font-weight:600;margin-bottom:3px}
.hero-title span{color:var(--rn)}
.hero-sub{font-size:12px;color:var(--mt)}
.loc{font-family:var(--mono);font-size:11px;color:var(--cl);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:.6rem}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid}
.cr{border-color:rgba(96,165,250,.35);color:var(--rn)}
.cs{border-color:rgba(248,113,113,.35);color:var(--st)}
.cc{border-color:rgba(52,211,153,.35);color:var(--cl)}
.ctrl{padding:.6rem 1.25rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--sf)}
.cl2{font-size:11px;color:var(--mt);white-space:nowrap}
.rg{display:flex;gap:3px}
.rb{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--mt);cursor:pointer;transition:all .2s}
.rb:hover{border-color:rgba(59,130,246,.5);color:var(--tx)}
.rb.on{background:rgba(59,130,246,.15);border-color:var(--ac);color:var(--rn)}
.sep{width:1px;height:16px;background:var(--bd);margin:0 3px;align-self:center}
.locbtn{font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid rgba(52,211,153,.3);background:transparent;color:var(--cl);cursor:pointer;font-family:var(--sans);display:flex;align-items:center;gap:5px;margin-left:auto;transition:all .2s}
.locbtn:hover{background:rgba(52,211,153,.08)}
#map{width:100%;height:420px}
.leaflet-container{background:#0a1628!important}
.leaflet-popup-content-wrapper{background:#111e35!important;color:#e8f0fe!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:10px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:#111e35!important}
.leaflet-popup-close-button{color:#7a94c1!important}
#alert{padding:.6rem 1.25rem;display:flex;align-items:center;gap:10px;font-size:13px;border-bottom:1px solid var(--bd);min-height:40px}
#alert.ok{background:rgba(52,211,153,.05);color:#6ee7b7}
#alert.warn{background:rgba(251,191,36,.05);color:#fcd34d}
#alert.danger{background:rgba(248,113,113,.06);color:#fca5a5}
#alert.load{background:rgba(59,130,246,.05);color:#93c5fd}
#alert.err{background:rgba(248,113,113,.08);color:#fca5a5}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--bd);border-bottom:1px solid var(--bd)}
.sb{background:var(--sf);padding:.7rem .75rem;text-align:center}
.sv{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1;margin-bottom:2px}
.sl{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.03em}
.sec{padding:1rem 1.25rem}
.stitle{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mt);margin-bottom:.75rem;display:flex;align-items:center;gap:8px}
.stitle::after{content:'';flex:1;height:1px;background:var(--bd)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}
.zcard{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:.85rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.zcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.zcard.rain::before{background:var(--rn)}
.zcard.storm::before{background:var(--st)}
.zcard.drizzle::before{background:var(--dr)}
.zcard.clear::before{background:var(--cl)}
.zcard.cloudy::before{background:#555}
.zcard:hover{border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
.ztop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.zn{font-size:13px;font-weight:500}
.zb{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px}
.bR{background:rgba(96,165,250,.15);color:var(--rn)}
.bS{background:rgba(248,113,113,.15);color:var(--st)}
.bD{background:rgba(251,191,36,.15);color:var(--dr)}
.bC{background:rgba(52,211,153,.15);color:var(--cl)}
.bN{background:rgba(122,148,193,.1);color:var(--mt)}
.zdir{font-size:11px;color:var(--mt);margin-bottom:6px}
.zbot{display:flex;justify-content:space-between;align-items:flex-end}
.zt{font-family:var(--mono);font-size:19px;font-weight:700}
.zm{font-size:10px;color:var(--mt);text-align:right;line-height:1.7}
.fscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fscroll::-webkit-scrollbar{height:3px}
.fscroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.fi{background:var(--sf);border:1px solid var(--bd);border-radius:7px;padding:7px 10px;text-align:center;flex-shrink:0;min-width:60px}
.fi.now{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.08)}
.ft{font-family:var(--mono);font-size:10px;color:var(--mt);margin-bottom:3px}
.fic{font-size:15px;margin-bottom:2px}
.fv{font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:2px}
.fp{font-size:10px}
footer{padding:.7rem 1.25rem;border-top:1px solid var(--bd);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--mt)}
.live{display:flex;align-items:center;gap:5px;font-family:var(--mono);color:var(--cl)}
@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.hero,.ctrl,.sec{padding:.75rem 1rem}#map{height:320px}nav{padding:.65rem 1rem}}
</style>
</head>
<body>
<nav>
  <div class="logo"><span class="dot"></span>RadarHujan</div>
  <div class="nav-r">
    <button class="btn" onclick="loadAll()">↻ Refresh</button>
    <button class="btn btn-p" onclick="locateMe()">📍 Lokasimu</button>
  </div>
</nav>
<div class="hero">
  <div class="hero-title">Radar Hujan <span>Real-Time</span></div>
  <div class="hero-sub">RainViewer + Open-Meteo · diperbarui tiap 10 menit</div>
  <div class="loc" id="loc">📍 Bandung, Jawa Barat</div>
  <div class="chips">
    <span class="chip cr" id="ch-r">💧 –</span>
    <span class="chip cs" id="ch-s">⛈ –</span>
    <span class="chip cc" id="ch-c">☀ –</span>
  </div>
</div>
<div class="ctrl">
  <span class="cl2">Radius:</span>
  <div class="rg" id="rg">
    <button class="rb" onclick="setR(0.5,this)">500m</button>
    <button class="rb on" onclick="setR(1,this)">1 km</button>
    <button class="rb" onclick="setR(2,this)">2 km</button>
    <button class="rb" onclick="setR(5,this)">5 km</button>
  </div>
  <div class="sep"></div>
  <span class="cl2">Layer:</span>
  <div class="rg" id="lg">
    <button class="rb on" onclick="setLayer('radar',this)">🔵 Radar</button>
    <button class="rb" onclick="setLayer('zone',this)">🟢 Zona</button>
  </div>
  <button class="locbtn" onclick="locateMe()"><span class="dot"></span>GPS</button>
</div>
<div id="map"></div>
<div id="alert" class="load">⏳&nbsp; Memuat data cuaca...</div>
<div class="stats">
  <div class="sb"><div class="sv" id="st-r" style="color:var(--rn)">–</div><div class="sl">Hujan</div></div>
  <div class="sb"><div class="sv" id="st-c" style="color:var(--cl)">–</div><div class="sl">Aman</div></div>
  <div class="sb"><div class="sv" id="st-t">–</div><div class="sl">Suhu °C</div></div>
  <div class="sb"><div class="sv" id="st-h" style="color:var(--dr)">–</div><div class="sl">Lembab</div></div>
  <div class="sb"><div class="sv" id="st-w" style="color:var(--mt)">–</div><div class="sl">Angin</div></div>
</div>
<div class="sec">
  <div class="stitle">Zona di sekitarmu</div>
  <div class="zgrid" id="zgrid"><div style="color:var(--mt);font-size:13px">Memuat...</div></div>
</div>
<div class="sec" style="padding-top:0">
  <div class="stitle">Prakiraan hari ini</div>
  <div class="fscroll" id="fscroll"><div style="color:var(--mt);font-size:13px">Memuat...</div></div>
</div>
<footer>
  <div class="live"><span class="dot"></span>Open-Meteo · RainViewer · Gratis</div>
  <div id="ts" style="font-family:var(--mono)">–</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var CENTER=[-6.9175,107.6191],CNAME='Bandung, Jawa Barat';
var radius=1,layerMode='radar';
var map,mgrp,radarTile=null,rcirc=null,allZones=[];

var OFFSETS=[
  {name:'Utara',dir:'U',dlat:0.009,dlng:0},
  {name:'Timur Laut',dir:'TL',dlat:0.006,dlng:0.007},
  {name:'Timur',dir:'T',dlat:0,dlng:0.010},
  {name:'Tenggara',dir:'TG',dlat:-0.006,dlng:0.007},
  {name:'Selatan',dir:'S',dlat:-0.009,dlng:0},
  {name:'Barat Daya',dir:'BD',dlat:-0.006,dlng:-0.007},
  {name:'Barat',dir:'B',dlat:0,dlng:-0.010},
  {name:'Barat Laut',dir:'BL',dlat:0.006,dlng:-0.007}
];

var WMO={
  0:{l:'Cerah',s:'clear',i:'☀️'},1:{l:'Cerah',s:'clear',i:'🌤️'},
  2:{l:'Berawan',s:'cloudy',i:'⛅'},3:{l:'Mendung',s:'cloudy',i:'☁️'},
  45:{l:'Kabut',s:'cloudy',i:'🌫️'},48:{l:'Kabut',s:'cloudy',i:'🌫️'},
  51:{l:'Gerimis',s:'drizzle',i:'🌦️'},53:{l:'Gerimis',s:'drizzle',i:'🌦️'},55:{l:'Gerimis',s:'drizzle',i:'🌧️'},
  61:{l:'Hujan ringan',s:'rain',i:'🌧️'},63:{l:'Hujan',s:'rain',i:'🌧️'},65:{l:'Hujan deras',s:'rain',i:'🌧️'},
  80:{l:'Hujan lokal',s:'rain',i:'🌦️'},81:{l:'Hujan',s:'rain',i:'🌧️'},82:{l:'Hujan deras',s:'storm',i:'⛈️'},
  95:{l:'Badai',s:'storm',i:'⛈️'},96:{l:'Badai',s:'storm',i:'⛈️'},99:{l:'Badai lebat',s:'storm',i:'⛈️'}
};
function gw(c){return WMO[c]||{l:'Berawan',s:'cloudy',i:'⛅'};}

var COL={storm:'#f87171',rain:'#60a5fa',drizzle:'#fbbf24',clear:'#34d399',cloudy:'#7a94c1'};
var LBL={storm:'Badai',rain:'Hujan',drizzle:'Gerimis',clear:'Cerah',cloudy:'Berawan'};
var BC={storm:'bS',rain:'bR',drizzle:'bD',clear:'bC',cloudy:'bN'};

function distKm(lat,lng){
  var R=6371,dLat=(lat-CENTER[0])*Math.PI/180,dLng=(lng-CENTER[1])*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(CENTER[0]*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function initMap(){
  map=L.map('map',{zoomControl:true}).setView(CENTER,14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OSM © CARTO',maxZoom:19,subdomains:'abcd'
  }).addTo(map);
  mgrp=L.layerGroup().addTo(map);
  addMeMarker();
}

function addMeMarker(){
  L.marker(CENTER,{icon:L.divIcon({
    html:'<div style="width:14px;height:14px;background:#3b82f6;border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(59,130,246,.25)"></div>',
    iconSize:[14,14],iconAnchor:[7,7],className:''
  })}).bindPopup('<b>📍 Posisimu</b><br><span style="color:#7a94c1;font-size:12px">'+CNAME+'</span>').addTo(map);
}

// ── RAINVIEWER RADAR ──────────────────────────────────
function loadRadar(){
  return fetch('https://api.rainviewer.com/public/weather-maps.json')
    .then(function(r){return r.json();})
    .then(function(d){
      if(radarTile){map.removeLayer(radarTile);radarTile=null;}
      var frames=d.radar&&d.radar.past?d.radar.past:[];
      if(!frames.length)return false;
      var latest=frames[frames.length-1];
      // Gunakan zoom 0 agar kompatibel semua level
      var url=d.host+latest.path+'/256/{z}/{x}/{y}/4/1_1.png';
      radarTile=L.tileLayer(url,{opacity:0.7,zIndex:200,
        attribution:'RainViewer'});
      if(layerMode==='radar')radarTile.addTo(map);
      return true;
    })
    .catch(function(){return false;});
}

// ── OPEN-METEO PER ZONA ───────────────────────────────
function fetchOne(lat,lng){
  var url='https://api.open-meteo.com/v1/forecast'
    +'?latitude='+lat+'&longitude='+lng
    +'&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m'
    +'&hourly=temperature_2m,precipitation_probability,weather_code'
    +'&forecast_days=1&timezone=Asia%2FJakarta';
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  });
}

function loadZones(){
  var tasks=OFFSETS.map(function(o){
    var lat=parseFloat((CENTER[0]+o.dlat).toFixed(5));
    var lng=parseFloat((CENTER[1]+o.dlng).toFixed(5));
    return fetchOne(lat,lng).then(function(d){
      var c=d.current;
      var w=gw(c.weather_code);
      var probs=d.hourly&&d.hourly.precipitation_probability?d.hourly.precipitation_probability:[];
      var now=new Date();
      var hi=-1;
      if(d.hourly&&d.hourly.time){
        for(var i=0;i<d.hourly.time.length;i++){
          if(new Date(d.hourly.time[i])>=now){hi=i;break;}
        }
      }
      var rainProb=hi>=0?(probs[hi]||0):(c.precipitation>0?75:8);
      return {name:o.name,dir:o.dir,lat:lat,lng:lng,
        status:w.s,desc:w.l,icon:w.i,
        temp:Math.round(c.temperature_2m),
        hum:Math.round(c.relative_humidity_2m),
        wind:Math.round(c.wind_speed_10m),
        rain:Math.round(rainProb),ok:true,hourly:d.hourly};
    }).catch(function(){
      return {name:o.name,dir:o.dir,
        lat:parseFloat((CENTER[0]+o.dlat).toFixed(5)),
        lng:parseFloat((CENTER[1]+o.dlng).toFixed(5)),
        status:'cloudy',desc:'Gagal',icon:'⛅',
        temp:0,hum:0,wind:0,rain:0,ok:false,hourly:null};
    });
  });
  return Promise.all(tasks);
}

// ── LOAD ALL ──────────────────────────────────────────
function loadAll(){
  setAlert('load','⏳','Memuat radar & data cuaca...');
  Promise.all([loadRadar(),loadZones()]).then(function(res){
    var radarOk=res[0];
    allZones=res[1];
    var ok=allZones.filter(function(z){return z.ok;}).length;
    var active=allZones.filter(function(z){return distKm(z.lat,z.lng)<=radius;});
    if(ok===0&&!radarOk){
      setAlert('err','❌','Gagal terhubung ke server cuaca. Periksa koneksi internet.');
    } else if(ok===0){
      setAlert('warn','🛰️','Radar tampil di peta. Data zona gagal — tekan Refresh.');
    } else {
      renderAlert(active);
    }
    renderAll();
    document.getElementById('ts').textContent='Diperbarui: '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  });
}

// ── RENDER ────────────────────────────────────────────
function renderAll(){
  var active=allZones.filter(function(z){return distKm(z.lat,z.lng)<=radius;});
  drawMap(active);
  renderZones(active);
  renderStats(active);
  renderChips(active);
  var wh=allZones.find(function(z){return z.ok&&z.hourly;});
  if(wh)renderForecast(wh.hourly);
}

function drawMap(active){
  mgrp.clearLayers();
  if(rcirc){map.removeLayer(rcirc);rcirc=null;}
  rcirc=L.circle(CENTER,{radius:radius*1000,color:'#3b82f6',weight:1.5,opacity:.4,fillColor:'#3b82f6',fillOpacity:.03,dashArray:'6 5'}).addTo(map);
  active.filter(function(z){return z.ok;}).forEach(function(z){
    var col=COL[z.status]||'#888';
    var op=z.status==='storm'?.55:z.status==='rain'?.45:z.status==='drizzle'?.32:.18;
    L.circle([z.lat,z.lng],{radius:80+(z.rain/100)*110,color:col,weight:0,fillColor:col,fillOpacity:op}).addTo(mgrp);
    L.marker([z.lat,z.lng],{icon:L.divIcon({
      html:'<div style="background:rgba(10,22,40,.9);border:1px solid '+col+'55;color:'+col+';font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;font-family:monospace">'+z.icon+' '+z.name+' '+z.temp+'°</div>',
      iconSize:[110,22],iconAnchor:[55,11],className:''
    })}).bindPopup(
      '<div style="font-family:sans-serif;min-width:165px;color:#e8f0fe;line-height:1.8">'
      +'<b style="font-size:14px">'+z.name+'</b><br>'
      +'<span style="color:#7a94c1;font-size:11px">'+z.dir+' · '+distKm(z.lat,z.lng).toFixed(2)+' km</span><br><br>'
      +'<span style="color:'+col+'">'+z.icon+' '+z.desc+'</span><br>'
      +'🌡️ <b>'+z.temp+'°C</b> | 💨 <b>'+z.wind+' km/h</b><br>'
      +'💧 Lembab: <b>'+z.hum+'%</b><br>'
      +'☔ Peluang hujan: <b>'+z.rain+'%</b>'
      +'</div>'
    ).addTo(mgrp);
  });
}

function renderZones(active){
  var el=document.getElementById('zgrid');
  if(!active.length){el.innerHTML='<div style="color:var(--mt);font-size:13px;grid-column:1/-1">Tidak ada zona dalam radius ini.</div>';return;}
  el.innerHTML=active.map(function(z){
    return '<div class="zcard '+z.status+'" onclick="map.flyTo(['+z.lat+','+z.lng+'],17,{duration:.8})">'
      +'<div class="ztop"><div class="zn">'+z.name+'</div><span class="zb '+(BC[z.status]||'bN')+'">'+(LBL[z.status]||z.status)+'</span></div>'
      +'<div class="zdir">📍 '+z.dir+' · '+distKm(z.lat,z.lng).toFixed(2)+' km</div>'
      +'<div class="zbot"><div class="zt" style="color:'+(COL[z.status]||'#888')+'">'+(z.ok?z.temp+'°':'–')+'</div>'
      +'<div class="zm">'+z.icon+' '+z.desc+'<br>💧'+z.hum+'% 💨'+z.wind+'km/h</div></div>'
      +'</div>';
  }).join('');
}

function renderStats(active){
  var ok=active.filter(function(z){return z.ok;});
  if(!ok.length)return;
  var rain=ok.filter(function(z){return z.status==='rain'||z.status==='storm';}).length;
  var clear=ok.filter(function(z){return z.status==='clear';}).length;
  var avgT=Math.round(ok.reduce(function(s,z){return s+z.temp;},0)/ok.length);
  var avgH=Math.round(ok.reduce(function(s,z){return s+z.hum;},0)/ok.length);
  var maxW=Math.max.apply(null,ok.map(function(z){return z.wind;}));
  document.getElementById('st-r').textContent=rain+'/'+ok.length;
  document.getElementById('st-c').textContent=clear+'/'+ok.length;
  document.getElementById('st-t').textContent=avgT+'°';
  document.getElementById('st-h').textContent=avgH+'%';
  document.getElementById('st-w').textContent=maxW;
}

function renderChips(active){
  var rain=active.filter(function(z){return z.status==='rain'||z.status==='storm';}).length;
  var storm=active.filter(function(z){return z.status==='storm';}).length;
  var clear=active.filter(function(z){return z.status==='clear';}).length;
  document.getElementById('ch-r').textContent='💧 '+rain+' hujan';
  document.getElementById('ch-s').textContent='⛈ '+storm+' badai';
  document.getElementById('ch-c').textContent='☀ '+clear+' cerah';
}

function renderForecast(h){
  if(!h||!h.time)return;
  var now=new Date(),items=[],n=0;
  for(var i=0;i<h.time.length&&n<9;i++){
    var t=new Date(h.time[i]);
    if(t<now-1800000)continue;
    var w=gw(h.weather_code[i]);
    var pct=Math.round((h.precipitation_probability&&h.precipitation_probability[i])||0);
    var lbl=n===0?'Skrg':t.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    var pc=pct>60?'#60a5fa':pct>30?'#fbbf24':'#34d399';
    items.push('<div class="fi'+(n===0?' now':'')+'"><div class="ft">'+lbl+'</div><div class="fic">'+w.i+'</div><div class="fv">'+Math.round(h.temperature_2m[i])+'°</div><div class="fp" style="color:'+pc+'">'+pct+'%</div></div>');
    n++;
  }
  document.getElementById('fscroll').innerHTML=items.join('');
}

function renderAlert(active){
  var hasStorm=active.some(function(z){return z.status==='storm';});
  var rainPct=active.filter(function(z){return z.status==='rain'||z.status==='storm';}).length/(active.length||1);
  if(hasStorm)setAlert('danger','⚠️','Badai petir terdeteksi di sekitarmu! Hindari perjalanan ke arah terdampak.');
  else if(rainPct>.5)setAlert('warn','🌧️','Lebih dari setengah zona hujan. Pilih arah yang lebih aman.');
  else setAlert('ok','✅','Kondisi sekitarmu cukup baik. Aman untuk perjalanan.');
}

function setAlert(cls,icon,msg){
  var el=document.getElementById('alert');
  el.className=cls;
  el.innerHTML=icon+'&nbsp; '+msg;
}

function setR(r,btn){
  radius=r;
  document.querySelectorAll('#rg .rb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  map.setView(CENTER,r<=.5?16:r<=1?15:r<=2?14:13,{animate:true});
  renderAll();
}

function setLayer(mode,btn){
  layerMode=mode;
  document.querySelectorAll('#lg .rb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  if(radarTile){
    if(mode==='radar'){if(!map.hasLayer(radarTile))radarTile.addTo(map);}
    else{if(map.hasLayer(radarTile))map.removeLayer(radarTile);}
  }
  renderAll();
}

function locateMe(){
  if(!navigator.geolocation){alert('Browser tidak mendukung GPS');return;}
  setAlert('load','📍','Mendeteksi posisi GPS...');
  navigator.geolocation.getCurrentPosition(function(pos){
    CENTER=[pos.coords.latitude,pos.coords.longitude];
    map.eachLayer(function(l){if(l instanceof L.Marker)map.removeLayer(l);});
    addMeMarker();
    map.flyTo(CENTER,15,{duration:1});
    fetch('https://nominatim.openstreetmap.org/reverse?lat='+CENTER[0]+'&lon='+CENTER[1]+'&format=json')
      .then(function(r){return r.json();})
      .then(function(d){
        CNAME=d.address&&(d.address.city||d.address.town||d.address.village||d.address.county)||'Lokasimu';
        document.getElementById('loc').textContent='📍 '+CNAME;
      }).catch(function(){
        document.getElementById('loc').textContent='📍 '+CENTER[0].toFixed(4)+', '+CENTER[1].toFixed(4);
      });
    loadAll();
  },function(){
    setAlert('warn','⚠️','Izin GPS ditolak. Aktifkan lokasi di pengaturan browser.');
  });
}

initMap();
loadAll();
setInterval(loadAll,600000);
</script>
